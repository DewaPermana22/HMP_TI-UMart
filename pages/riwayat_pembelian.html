<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMart - History</title>
    <link rel="stylesheet" href="/assets/style.css">
    <link rel="stylesheet" href="/assets/alert.css">
    <link rel="stylesheet" href="/assets/history.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="/assets/UmMart - Logo_OnlyBag.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="navbar-container">
            <div class="logo">
                <img src="/assets/UmMart - Logo.svg" alt="logo-aplikasi">
            </div>
            <div class="button-region-nav">
                <button title="Keranjang" id="cart-button">
                    <img src="/assets/icon/shopping-cart.svg"></img>
                </button>
                <button title="Beranda" id="home-button">
                    <i data-lucide="Home"></i>
                </button>
            </div>
            <div class="button-region-nav-mobile">
                <button title="Keranjang" id="cart-button">
                    <img src="/assets/icon/shopping-cart.svg"></img>
                </button>
                <button title="Beranda" id="home-button">
                    <i data-lucide="Home"></i>
                </button>
            </div>
        </nav>
    </header>
    <section>
        <div class="hero-container-history">
            <h2>Riwayat <span style="color: var(--red);">Pembelian</span></h2>

            <div class="table-container">
            <div class="table-wrapper">
                <table id="purchaseTable">
                    <thead>
                        <tr>
                            <th>Nama Pembeli</th>
                            <th>Alamat</th>
                            <th>No HP</th>
                            <th>Catatan</th>
                            <th>Tanggal Pembelian</th>
                            <th>Metode Pembayaran</th>
                            <th>Bukti Transfer</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Data akan diisi oleh script -->
                    </tbody>
                </table>
            </div>
        </div>
        </div>
    </section>

    <div id="modalOverlay" class="modal-overlay">
    <div class="modal" id="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
        <div class="modal-title" id="modalTitle">Detail Transaksi</div>
        <button class="modal-close" onclick="tutupModal()">&times;</button>
    </div>
    <div class="modal-content">
        <!-- render konten detail transaksi -->
    </div>
    <div class="modal-actions">
        <button class="btn btn-secondary">Batalkan</button>
        <button class="btn btn-primary">Tandai Selesai</button>
    </div>
    </div>
    </div>
    <script src="/script/lucideLoad.js"></script>
    <script src="/script/navbarHandler.js"></script>
    <script src="/script/utils.js"></script>
    <script src="/script/scriptHistory.js"></script>
</body>
</html>
